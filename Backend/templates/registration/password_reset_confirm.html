{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Enter new password</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="login-body">
    <div class="glass-container">
        <h2>Set a new password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="login-btn">Change my password</button>
        </form>
    </div>
</body>

</html>
