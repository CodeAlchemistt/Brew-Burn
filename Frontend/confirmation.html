<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew & Burn – Order Confirmed!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="checkout.css" />
</head>

<body style="background-color: #FDF6EC;">

    <header class="py-4">
        <div class="logo-box text-center">
            <h1 class="logo-title">Brew & Burn</h1>
            <small class="logo-sub">Brewing comfort, Baking connection</small>
        </div>
    </header>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 60vh;">
        <div class="confirmation-card bg-white p-4 p-md-5 rounded shadow-sm col-lg-6">
            <div class="icon mb-3">☕</div>
            <h2 class="section-title">Your order is on its way!</h2>
            <p class="text-muted">Thank you for your order. We're getting it ready with love and care.</p>
            <div class="my-4">
                <p class="mb-1"><strong>Order ID:</strong> <span id="order-id">#BB00000</span></p>
                <p><strong>Estimated Delivery Time:</strong> 45 Minutes</p>
            </div>
            <a href="index.html" class="btn btn-main">Continue Shopping</a>
            <a href="order_history.html" class="btn btn-outline-secondary mt-2">View Order History</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
