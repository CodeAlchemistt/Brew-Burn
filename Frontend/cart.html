<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew & Burn – Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="cart.css" />
</head>

<body>
    <!-- Header with Logo -->
    <header>
        <div class="logo-box text-center">
            <h1 class="logo-title">Brew & Burn</h1>
            <small class="logo-sub">Brewing comfort, Baking connection</small>
        </div>
    </header>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-lg-none" href="#">BREW & BURN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto navbar-links">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="coffee.html">Our Coffee</a></li>
                    <li class="nav-item"><a class="nav-link" href="bakery.html">Our Bakery</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
                </ul>
                <div class="d-flex align-items-center top-icons">
                    <a href="account.html" class="icon-link"><i class="fas fa-user"></i></a>
                    <a href="cart.html" class="icon-link position-relative">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-badge badge rounded-pill">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>


    <section class="cart-section py-5">
        <div class="container">
            <h2 class="text-center mb-4">Your Cart</h2>
            <hr>
            <div id="cart-items" class="row g-3">
            </div>
            <div class="cart-total text-end mt-4">
                <h4>Total: ₹ <span id="cart-total-amount">0.00</span></h4>
                <a href="checkout.html" class="btn btn-main mt-3" id="checkout-btn">Proceed to Checkout</a>
            </div>
            <div id="empty-cart-message" class="text-center mt-4" style="display: none;">
                <p>Nothing here...<a href="index.html">Start shopping now!</a></p>
            </div>
        </div>
    </section>

    <footer class="footer bg-light pt-4 pb-2 text-dark">
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
